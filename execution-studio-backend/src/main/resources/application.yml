server:
  port: 8080

spring:
  application:
    name: execution-studio-backend
  main:
    banner-mode: "off"

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

execution-studio:
  temp-directory: "${java.io.tmpdir}/execution-studio"
  upload-directory: "${java.io.tmpdir}/execution-studio/uploads"
  timeout-seconds: 10
  object-depth: 5
  step-limit: 1000
  serializer:
    pretty-print: true
    include-nulls: false
